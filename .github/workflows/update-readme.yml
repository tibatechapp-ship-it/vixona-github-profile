name: update-last-updated

# يحدّث جدول «آخر تحديث» في README تلقائياً من أوقات آخر دفعة
# للمشاريع الستة عبر GitHub API — بلا أي تدخل يدوي.

on:
  schedule:
    - cron: "0 */6 * * *"   # كل 6 ساعات
  workflow_dispatch:          # تشغيل يدوي عند الحاجة

permissions:
  contents: write

concurrency:
  group: update-last-updated
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Last Updated table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_last_updated.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: auto-update Last Updated table [skip ci]"
            git push
          else
            echo "No changes — nothing to commit"
          fi
